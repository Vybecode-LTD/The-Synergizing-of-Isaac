name: CI

# One run per pull request and per push to main. A newer push to the same branch cancels the older run.
# The weekly fold (community-backup.yml) also calls it on its own branch before merging that branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The branch to check out and test
        type: string
        required: true

concurrency:
  # A called run is grouped by its branch, so a push to main never cancels the fold's checks (or they it).
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build, design audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: The game data has a chunk of its own and no file passes 500 kB
        run: npm run bundle:check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design system audit
        run: |
          python ../scripts/design/audit_design.py src --strict
          python ../scripts/design/check_roles.py src/styles/tokens.css
          python ../scripts/design/check_roles.py src/styles/tokens.css --pairs ../scripts/design/toy-box-pairs.json

  api:
    name: API (lint, types, tests) and data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - name: Game data is consistent
        run: python ../scripts/gamedata.py validate
      - name: Browser and server snapshot is current
        run: python -m app.parity --check
      - run: python -m pytest --cov --cov-fail-under=85

  docker:
    # Docker is not installed on the owner's machine, so this is where the image Railway builds is proven,
    # first by the standard-library smoke test, then in a real browser.
    name: Docker image (build, run as Railway does, smoke and browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the image from the Dockerfile Railway uses
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: isaac-toys:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it as Railway does (PORT injected, a volume at /data, no key)
        run: |
          docker volume create isaac-data
          docker run -d --name site -p 8080:8080 -e PORT=8080 -e ENVIRONMENT=ci -v isaac-data:/data isaac-toys:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          echo "The container never answered /api/health"
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test (standard library only, nothing to install)
        working-directory: api
        run: python -m app.smoke http://localhost:8080 --ai off
      - name: The database file is on the volume
        run: docker exec site test -f /data/isaac-toys.sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the browser test and Playwright's Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser end-to-end test against the container (no AI key, so nothing is spent)
        working-directory: web
        env:
          SITE: http://localhost:8080
        run: npm run e2e
      - name: Keep the browser test's traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Container log
        if: always()
        run: docker logs site
