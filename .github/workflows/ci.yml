name: CI

# One run per pull request and per push to main. A newer push to the same branch cancels the older run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build, design audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design system audit
        run: |
          python ../scripts/design/audit_design.py src --strict
          python ../scripts/design/check_roles.py src/styles/tokens.css
          python ../scripts/design/check_roles.py src/styles/tokens.css --pairs ../scripts/design/toy-box-pairs.json

  api:
    name: API (lint, types, tests) and data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - name: Game data is consistent
        run: python ../scripts/gamedata.py validate
      - name: Browser and server snapshot is current
        run: python -m app.parity --check
      - run: python -m pytest --cov --cov-fail-under=85
